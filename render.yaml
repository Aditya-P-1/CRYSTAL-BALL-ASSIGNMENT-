services:
  # Express Backend API Service
  - type: web
    name: oomnieye-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/

  # Next.js Frontend Web Service
  - type: web
    name: oomnieye-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: oomnieye-backend
          property: host
